# Hunch — the AI teammate inside your WhatsApp Business inbox.
# Deploy: npx wrangler deploy   (from this directory)
#
# Before first deploy:
#   npx wrangler kv namespace create HUNCH_KV     → paste the id below
#   npx wrangler secret put ANTHROPIC_API_KEY     (console.anthropic.com)
#   npx wrangler secret put WHATSAPP_TOKEN        (Meta system-user token)
#   npx wrangler secret put WHATSAPP_APP_SECRET   (Meta app secret — webhook signatures)
#   npx wrangler secret put WEBHOOK_VERIFY_TOKEN  (any random string; reuse in Meta webhook setup)
#   npx wrangler secret put ADMIN_SECRET          (random string; guards dashboard/invoices/admin)

name = "hunch-whatsapp"
main = "src/index.js"
compatibility_date = "2026-07-01"

[vars]
# Meta → WhatsApp → API Setup → "Phone number ID" (not the phone number itself)
WHATSAPP_PHONE_NUMBER_ID = "REPLACE_ME"
# The owner(s): their personal WhatsApp numbers in international format, no '+',
# comma-separated. Messages from these numbers reach the copilot; everyone else
# is treated as a customer.
OWNER_NUMBERS = "REPLACE_ME"
# Shown on the dashboard, invoices and in the assistant's replies.
BUSINESS_NAME = "My Business"
# Default currency for extracted amounts and invoices (ISO code).
CURRENCY = "USD"

# Optional voice-note tuning. TRANSCRIBE_LANGUAGE forces one spoken language
# (e.g. "hi", "ta"); leave unset to auto-detect, which suits mixed customers.
# TRANSCRIBE_PROMPT overrides the vocabulary hint passed to Whisper.
# TRANSCRIBE_LANGUAGE = "hi"

# Workers AI (Whisper) transcribes WhatsApp voice notes. No extra API key:
# it bills to the same Cloudflare account.
[ai]
binding = "AI"

[[kv_namespaces]]
binding = "HUNCH_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
